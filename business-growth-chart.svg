<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Business growth chart</title>
<desc id="desc">Champagne-gold bars and an upward-trending line on a dark background, representing strategic business growth.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171612"/><stop offset="1" stop-color="#080808"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8f7443"/><stop offset="1" stop-color="#e2c786"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#6e5732" stop-opacity=".52"/><stop offset="1" stop-color="#d6b574" stop-opacity=".88"/></linearGradient>
</defs>
<rect width="1200" height="900" fill="url(#bg)"/>
