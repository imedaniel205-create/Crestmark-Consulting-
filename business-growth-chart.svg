 <rect x="390" y="505" width="105" height="215" rx="2"/>
 <rect x="560" y="410" width="105" height="310" rx="2"/>
 <rect x="730" y="300" width="105" height="420" rx="2"/>
 <rect x="900" y="205" width="105" height="515" rx="2"/>
</g>
